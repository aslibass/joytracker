<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoyBucket - Log Your Joy</title>
    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" href="/static/css/output.css?v=2">
    <!-- HTMX (Hosted Locally) -->
    <script src="/static/js/htmx.min.js?v=2"></script>
    <!-- Google Fonts: Inter & Outfit -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
    <link rel="icon" type="image/png" href="/static/icons/icon-192x192.png">
    <meta name="theme-color" content="#f59e0b">
    <link rel="manifest" href="/static/manifest.json">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body
    class="bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <header class="p-6 flex justify-between items-center max-w-6xl mx-auto w-full">
        <a href="/" class="flex items-center gap-2 group">
            <div
                class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg group-hover:scale-105 transition-transform">
                J</div>
            <span class="text-2xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">JoyBucket</span>
        </a>
        <div class="flex items-center gap-3">
            <!-- Theme Toggle -->
            <button id="theme-toggle" type="button"
                class="text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-xl text-sm p-2.5">
                <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
                <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                        fill-rule="evenodd" clip-rule="evenodd"></path>
                </svg>
            </button>
            <div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-800 mx-1"></div>
            {% if user %}
            <div class="flex items-center gap-4 ml-1">
                <a href="/"
                    class="text-xs font-black uppercase tracking-widest text-slate-400 hover:text-amber-500 transition-colors">Home</a>

                {% if user.is_admin %}
                <a href="/dashboard"
                    class="text-xs font-black uppercase tracking-widest text-amber-600 dark:text-amber-500 hover:text-amber-700 dark:hover:text-amber-400 transition-colors flex items-center gap-1">
                    Leader View
                </a>
                {% endif %}

                <a href="/logout"
                    class="text-xs font-black uppercase tracking-widest text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 transition-colors">Logout</a>

                <img src="{{ user.avatar_url }}" alt="Avatar"
                    class="w-8 h-8 rounded-full border-2 border-white dark:border-slate-800 shadow-sm">
            </div>
            {% endif %}
        </div>
    </header>

    <main class="container mx-auto px-4 pb-24">
        {% block content %}{% endblock %}
    </main>

    <!-- FAB for adding joy -->
    {% if user and request.url.path != "/dashboard" %}
    <button onclick="document.getElementById('joy-modal').showModal()"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 w-16 h-16 bg-amber-500 hover:bg-amber-600 text-white rounded-full flex items-center justify-center shadow-2xl transition-all hover:scale-110 active:scale-95 group z-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 group-hover:rotate-90 transition-transform duration-300"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
    </button>
    {% endif %}

    <!-- Modal -->
    <dialog id="joy-modal"
        class="modal p-0 rounded-3xl shadow-2xl bg-white dark:bg-slate-900 border-none backdrop:backdrop-blur-sm w-full max-w-md">
        <div class="p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Log a Moment of Joy</h2>
                <button onclick="document.getElementById('joy-modal').close()"
                    class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">&times;</button>
            </div>
            <form hx-post="/log" hx-target="#joy-feed" hx-swap="afterbegin"
                hx-on::after-request="document.getElementById('joy-modal').close(); this.reset();">
                <textarea id="joy-content" name="content" rows="4" placeholder="What brought you joy today?"
                    class="w-full p-4 bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800 rounded-2xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all resize-none text-lg dark:text-slate-200"></textarea>
                <div class="mt-6 flex gap-3">
                    <button type="submit"
                        class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-[0.98]">
                        Save To Bucket
                    </button>
                    <button type="button" id="mic-btn"
                        class="p-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-2xl transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-500 dark:text-slate-400"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        document.body.addEventListener('htmx:afterRequest', function (evt) {
            if (evt.detail.pathInfo.requestPath === '/log') {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#f59e0b', '#fbbf24', '#fcd34d']
                });
            }
        });

        // --- Voice Logging (SpeechToText) Implementation ---
        const micBtn = document.getElementById('mic-btn');
        const joyTextarea = document.getElementById('joy-content');

        if (micBtn && ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            let isRecording = false;

            micBtn.addEventListener('click', () => {
                if (!isRecording) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            });

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.remove('bg-slate-100', 'dark:bg-slate-800');
                micBtn.classList.add('bg-rose-500', 'animate-pulse');
                micBtn.querySelector('svg').classList.replace('text-slate-500', 'text-white');
                micBtn.querySelector('svg').classList.replace('dark:text-slate-400', 'text-white');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                joyTextarea.value += (joyTextarea.value ? ' ' : '') + transcript;
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.add('bg-slate-100', 'dark:bg-slate-800');
                micBtn.classList.remove('bg-rose-500', 'animate-pulse');
                micBtn.querySelector('svg').classList.replace('text-white', 'text-slate-500');
                // Ensure dark mode text color also restores
                if (document.documentElement.classList.contains('dark')) {
                    micBtn.querySelector('svg').classList.add('dark:text-slate-400');
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                recognition.stop();
            };
        } else if (micBtn) {
            micBtn.classList.add('opacity-30', 'cursor-not-allowed');
            micBtn.title = "Speech recognition not supported in this browser.";
        }

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function updateThemeUI(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
                localStorage.setItem('color-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                themeToggleDarkIcon.classList.remove('hidden');
                themeToggleLightIcon.classList.add('hidden');
                localStorage.setItem('color-theme', 'light');
            }
        }

        // Initialize UI based on current state
        const isCurrentlyDark = document.documentElement.classList.contains('dark');
        updateThemeUI(isCurrentlyDark);

        themeToggleBtn.addEventListener('click', function () {
            const isDark = document.documentElement.classList.contains('dark');
            updateThemeUI(!isDark);
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js');
            });
        }
    </script>
</body>

</html>
