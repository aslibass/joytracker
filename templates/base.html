<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoyBucket - Log Your Joy</title>
    <!-- Tailwind CSS (CDN for simplicity) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Google Fonts: Inter & Outfit -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3 {
            font-family: 'Outfit', sans-serif;
        }

        .golden-hour {
            background: linear-gradient(135deg, #FFF9C4 0%, #FFECB3 100%);
        }
    </style>
    <link rel="manifest" href="/static/manifest.json">
</head>

<body class="bg-slate-50 min-h-screen text-slate-900">

    <header class="p-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div
                class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg">
                J</div>
            <span class="text-2xl font-bold text-slate-800 tracking-tight">JoyBucket</span>
        </div>
        {% if user %}
        <div class="flex items-center gap-4">
            <img src="{{ user.avatar_url }}" alt="Avatar"
                class="w-10 h-10 rounded-full border-2 border-white shadow-sm">
            <a href="/logout"
                class="text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">Logout</a>
        </div>
        {% endif %}
    </header>

    <main class="container mx-auto px-4 pb-24">
        {% block content %}{% endblock %}
    </main>

    <!-- FAB for adding joy -->
    {% if user %}
    <button onclick="document.getElementById('joy-modal').showModal()"
        class="fixed bottom-8 right-8 w-16 h-16 bg-amber-500 hover:bg-amber-600 text-white rounded-full flex items-center justify-center shadow-2xl transition-all hover:scale-110 active:scale-95 group">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 group-hover:rotate-90 transition-transform duration-300"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <!-- Modal -->
    <dialog id="joy-modal"
        class="modal p-0 rounded-3xl shadow-2xl bg-white border-none backdrop:backdrop-blur-sm w-full max-w-md">
        <div class="p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Log a Moment of Joy</h2>
                <button onclick="document.getElementById('joy-modal').close()"
                    class="text-slate-400 hover:text-slate-600">&times;</button>
            </div>
            <form hx-post="/log" hx-target="#joy-feed" hx-swap="afterbegin"
                hx-on::after-request="document.getElementById('joy-modal').close(); this.reset();">
                <textarea name="content" rows="4" placeholder="What brought you joy today?"
                    class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all resize-none text-lg"></textarea>
                <div class="mt-6 flex gap-3">
                    <button type="submit"
                        class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-[0.98]">
                        Save To Bucket
                    </button>
                    <button type="button" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-2xl transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-500" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </dialog>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        document.body.addEventListener('htmx:afterRequest', function (evt) {
            if (evt.detail.pathInfo.requestPath === '/log') {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#f59e0b', '#fbbf24', '#fcd34d']
                });
            }
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js');
            });
        }
    </script>
</body>

</html>
